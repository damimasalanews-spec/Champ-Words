# Render Blueprint — Champ Words
# Deploy: render.com → New → Blueprint → select this repo (render.yaml is auto-detected)
# Secrets are NOT stored here — set TIKTOK_* values in the Render dashboard
# after the service is created (they appear as "must be set before deploy" fields).

services:
  - type: web
    name: champ-words
    runtime: node
    plan: free
    buildCommand: npm run build:deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      # --- TikTok OAuth (set in dashboard after first deploy) ---
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        sync: false
        # value: https://champ-words.onrender.com/auth/tiktok/callback
      # --- TikTok LIVE chat answers (all OFF by default — safe) ---
      # Set CHAT_BRIDGE_ENABLED=true + TIKTOK_LIVE_USERNAME to read live chat.
      # TIKTOK_SESSION_ID (optional): TikTok web session cookie for reliability.
      # CHAT_FIXED_POINTS: fixed points per correct chat answer (0 = speed-based).
      # CHAT_ROOM_PIN: optional room code to lock chat answers to one room.
      # CHAT_TEST_KEY: ONLY for testing — enables /api/debug/word. Never set in production.
      - key: CHAT_BRIDGE_ENABLED
        value: true
      - key: TIKTOK_LIVE_USERNAME
        value: champbj
      - key: TIKTOK_SESSION_ID
        sync: false
      - key: CHAT_FIXED_POINTS
        sync: false
      - key: CHAT_ROOM_PIN
        sync: false
      - key: CHAT_TEST_KEY
        sync: false
      # Gift-powered hints: CHAT_GIFT_MIN_DIAMONDS (min diamonds to reveal a
      # letter, default 1), CHAT_GIFT_COOLDOWN_MS (per-user cooldown, default 5000),
      # CHAT_GIFT_TIER2_DIAMONDS (≥ → 2 letters, default 30),
      # CHAT_GIFT_TIER3_DIAMONDS (≥ → full word, default 100).
      - key: CHAT_GIFT_MIN_DIAMONDS
        sync: false
      - key: CHAT_GIFT_COOLDOWN_MS
        sync: false
      - key: CHAT_GIFT_TIER2_DIAMONDS
        sync: false
      - key: CHAT_GIFT_TIER3_DIAMONDS
        sync: false
      # Anti-spam: CHAT_ANSWER_COOLDOWN_MS (per-user wrong-answer cooldown, default 3000).
      - key: CHAT_ANSWER_COOLDOWN_MS
        sync: false
