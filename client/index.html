<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141032" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Oxanium:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Champ Words</title>
  </head>
  <body>
    <div id="root">
      <!-- Loading splash — replaced as soon as React mounts (covers cold starts) -->
      <div id="boot-splash">
        <div class="boot-logo">CHAMP<span>WORDS</span></div>
        <div class="boot-spinner"></div>
        <div class="boot-text">Waking the room…</div>
      </div>
      <style>
        #boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
          align-items: center; justify-content: center; background: #0d0a1f; font-family: Oxanium, sans-serif; }
        .boot-logo { font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #fff; }
        .boot-logo span { color: #ffd76a; }
        .boot-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,215,106,.2);
          border-top-color: #ffd76a; animation: bootspin .8s linear infinite; }
        @keyframes bootspin { to { transform: rotate(360deg); } }
        .boot-text { font-size: 13px; color: rgba(255,255,255,.55); }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
