<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play — Champ Words</title>
    <meta name="description" content="Enter the Champ Words arena — live multiplayer word racing in your browser." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/game-site.css" rel="stylesheet" />
</head>
<body class="cw-gaming play-full">
    <div class="game-site cw-play-full">

        <div class="cw-play-full-bar">
            <span class="cw-play-brand"><span class="mini-tile">&#127942;</span><b>Champ Words</b></span>
            <span class="srv-dot" data-srv-dot></span>
            <span data-srv-label>Game server online</span>
            <span class="cw-play-hint">&#127922; Room codes, missions &amp; leaderboards are all inside the arena</span>
            <a href="index.html">&#8592; Back to Site</a>
            <a class="fs-link" data-game-full href="/game" target="_blank" rel="noopener">Open Fullscreen &#8599;</a>
        </div>

        <div class="cw-frame-offline cw-play-offline" data-game-offline style="display:none">
            <div class="big">&#9888;&#65039; The arena is waking up</div>
            <div>Render's free tier sleeps when idle &mdash; give it a few seconds and refresh this page.</div>
        </div>

        <iframe data-game-frame src="about:blank" title="Champ Words — Multiplayer Word Game" allow="microphone; camera" allowfullscreen style="display:none"></iframe>

    </div><!-- /.game-site -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
